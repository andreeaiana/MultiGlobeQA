tid: "8.2"
tid_family: 8
sfid: A
ssfid: 6
spatial_function: distance_knn_then_distance_2
ground_truth_type: distance_kilometers
answer_unit: km

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - entity_c_id
  - entity_c_name
  - ground_truth

pools:
  - pool_a
  - pool_b
  - pool_c

# Same two pairings as 8.1 — only k_rank differs.
variants:
  poi_to_poi_to_poi:
    description: "Distance from the 2nd nearest POI-A-to-POI-B over to POI-C."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"

  poi_to_poi_to_natural_feature:
    description: "Distance from the 2nd nearest POI-A-to-POI-B over to a natural feature C."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'natural_feature_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'natural_feature_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'natural_feature_category'"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_b: 67890
  anchor_cap: 50
  k_rank: 2

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
    entity_c_id: pool_c
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
