tid: "4.1"
tid_family: 4
sfid: A
ssfid: 3
spatial_function: distance_comparative_closer
ground_truth_type: entity_name
answer_unit: name

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - entity_c_id
  - entity_c_name
  - ground_truth

# 3-pool TID — comparative distance is "is A or B closer to C?". Each
# slot needs its own filterable view; the executor builds one per pool.
pools:
  - pool_a
  - pool_b
  - pool_c

# Two pairings declared in sfid_a_registry.yaml::TID 6 STID 1:
#   pairing 1 — POI × POI × POI
#   pairing 2 — POI × POI × region
# Mapped to two variants here so the runtime can pick by ref `4.1:poi`
# or `4.1:poi_region`. Distinct seeds per pool are critical for the
# poi variant (all three pools draw from the same set).
variants:
  poi:
    description: "Is POI A or POI B closer to POI C?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'POI_category'"

  poi_region:
    description: "Is POI A or POI B closer to region C?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'region_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'region_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
        pool_c:
          source: entities
          filter: "category = 'region_category'"

# Three-way distinctness predicate. The triple ROW_NUMBER joins enforce
# rank equality; this WHERE keeps the entities pairwise different so a ==
# b or a == c (when pools overlap) doesn't poison the answer.
join_condition: "a.id != b.id AND a.id != c.id AND b.id != c.id"

sampling:
  strategy: row_number_hash

# Three independent seeds — symmetric POI×POI×POI variant otherwise
# collapses to identical ranks across pools and the != predicates
# would drop everything.
parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890
  rand_seed_c: 24680

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
    entity_c_id: pool_c
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
