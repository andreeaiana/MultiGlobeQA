tid: "2.1"
tid_family: 2
sfid: A
ssfid: 1
spatial_function: distance_directional_north
ground_truth_type: distance_kilometers
answer_unit: km

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Per sfid_a_registry.yaml the 2.x family is POI_instance × POI_instance only
# (no region variant — directional distance between two regions is semantically
# weak: regions are large, "north of" gets fuzzy at scale).
variants:
  poi:
    description: "Northward distance between two POIs (A north of B)."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"

# Direction filter (A north of B) is appended to the rank-equality join.
# h3_res3 equality intentionally OMITTED — matches 1.1's current join shape.
# Same-country, no-self, rank-equality, plus ST_Y centroid comparison.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id AND ST_Y(ST_Centroid(ST_GeomFromWKT(a.geometry))) > ST_Y(ST_Centroid(ST_GeomFromWKT(b.geometry)))"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
