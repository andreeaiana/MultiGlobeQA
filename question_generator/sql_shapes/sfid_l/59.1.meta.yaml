tid: "59.1"
tid_family: 59
sfid: L
ssfid: 1
spatial_function: qualitative_far
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi:
    description: "Is POI A far from POI B (same country, ≥10 km)?"
    # No same-h3-cell constraint here — "far" needs cross-cell pairs to
    # find true 'true' answers (most pairs in the same h3 cell are < 10 km).
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

# Same-country + rank-equality + no-self. NO h3_res3 (need cross-cell).
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890
  # POI × POI threshold per registry header (10km).
  far_threshold_km: 10.0

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
