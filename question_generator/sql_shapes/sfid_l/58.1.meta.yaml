tid: "58.1"
tid_family: 58
sfid: L
ssfid: 1
spatial_function: qualitative_near
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Single primary variant: POI × POI within same h3 cell. Other pairings
# (POI x natfeat at 5km, natfeat x natfeat at 10km) would be additional
# sibling sub-templates reusing this same SQL, with only
# near_threshold_km + pool filters changed.
variants:
  poi:
    description: "Is POI A approximately near POI B (same h3 cell, same country, ≤1 km)?"
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

# Same-country + same-h3-cell + rank-equality + no-self.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id AND a.h3_res3 = b.h3_res3"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890
  # POI x POI proximity threshold (1 km).
  near_threshold_km: 1.0

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
