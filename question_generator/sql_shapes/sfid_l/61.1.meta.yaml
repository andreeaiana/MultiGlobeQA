tid: "61.1"
tid_family: 61
sfid: L
ssfid: 1
spatial_function: qualitative_vague_nearest
ground_truth_type: set_enumeration
answer_unit: null

result_columns:
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi:
    description: "Which POIs are roughly closest to POI B (top-5 within same h3 cell)?"
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

# Per-anchor (b) joins all POIs in same h3 cell + same country, ranks by
# distance ASC, picks top {top_k}. The LEFT JOIN + HAVING COUNT >= 3
# in the SQL drops anchors with too-few candidates.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.h3_res3 = b.h3_res3"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_b: 67890
  per_country_cap: 50
  # Registry pins top-k = 5 ("top 5 entities of category A nearest to B").
  top_k: 5

gold_triples:
  # Single-role: anchor only. The k matched POIs are aggregated into
  # ground_truth as a JSON list of names — gold-triple provenance for the
  # match set would need a separate ROW_NUMBER per (anchor, match) pair
  # (see 11.1's gold UNION pattern for the precedent if expanding later).
  pool_map:
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
