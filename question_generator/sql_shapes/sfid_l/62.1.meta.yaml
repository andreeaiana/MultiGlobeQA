tid: "62.1"
tid_family: 62
sfid: L
ssfid: 1
spatial_function: qualitative_probabilistic_containment
ground_truth_type: categorical
answer_unit: null

# 3-tier categorical ground_truth: 'Yes' / 'Plausibly' / 'No'. No
# validator rule for `categorical` — falls through to valid (the values
# are well-formed by construction; the rare NULL container case is
# handled by the SELECT's CASE).

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi_in_region:
    description: "Is POI A plausibly within region B (containment + 500m boundary buffer)?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON') AND node_type IN ('AdministrativeRegion_1', 'AdministrativeRegion_2')"
      # worldkg excluded: region entities are POINT geometries, ST_Contains
      # would always be false → answer collapses to 'No' / 'Plausibly' only.

# Same-country, no-self. Sedona pattern: ST_Contains in the join condition
# uses the materialized geom column from the pre-CTEs.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  per_country_cap: 50

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
