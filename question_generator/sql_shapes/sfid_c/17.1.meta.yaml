tid: "17.1"
tid_family: 17
sfid: C
ssfid: 3
spatial_function: intersection_category_enumerate
ground_truth_type: set
answer_unit: null

result_columns:
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Single deliverable pairing: road_network_feature_category ×
# road_network_feature_instance. road_network_feature_category resolves
# to one node_type (`highway`) per entity_constraints/class_lookup.csv,
# so this ftid ships ONE variant. Sibling 16.1 uses the same pairing
# with COUNT instead of COLLECT_LIST.
variants:
  highway:
    description: "Enumerated highways intersecting an anchor road feature."
    parameters:
      entity_a_label: highways
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"

# Same-country, no-self, ST_Intersects in JOIN ON for Sedona's
# RangeJoinExec recognition.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND ST_Intersects(a.geom, b.geom)"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_b: 67890
  per_country_cap: 50

# Aggregate gold extension: the enumeration depends on every pool_a
# entity matching the spatial predicate. Mirror 10.1 / 16.1's
# uris_to_fetch UNION pattern. attach_question_ids_to_gold joins gold
# by entity_id == row['entity_b_id'].
gold_triples:
  pool_map:
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
