tid: "15.1"
tid_family: 15
sfid: C
ssfid: 2
spatial_function: intersection_point_count
ground_truth_type: count
answer_unit: count

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Three pairings for the intersection_point_count shape, all
# restricted to LINESTRING /
# MULTILINESTRING geometry on BOTH sides — POLYGON intersections return
# area geometries, not points; restricting to lines lets
# ST_CollectionExtract(..., 1) recover just the point components.
#
# All 3 KGs apply (pure topology, no per-KG sparsity). geometry_type
# filter applied at pool view registration; the SQL assumes the
# constraint holds.
variants:
  road_road:
    description: "Point count where two road features (LINESTRINGs) intersect."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"

  road_natural:
    description: "Point count where a road feature intersects a natural-feature LINESTRING (river / waterway)."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"

  natural_natural:
    description: "Point count where two natural-feature LINESTRINGs intersect (e.g. river × stream)."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING')"

# Same-country, no-self pair, with the a.id < b.id ordering acting
# as a deterministic deduplication for symmetric variants
# (road_road, natural_natural). Without a.id < b.id, every (A, B)
# would also produce (B, A) with identical ground_truth.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id < b.id"

sampling:
  strategy: row_number_hash

# rand_seed_b: feeds the hash() inside pool_b's per-country ROW_NUMBER,
#   so reruns with the same seed pick identical anchors per country.
# per_country_cap: 50 — with ~150 countries this caps anchors at ~7,500,
#   slightly above the default total_sample=5,000 so the outer LIMIT
#   trims the tail rather than the per-country cap binding.
parameters:
  rand_seed_b: 67890
  per_country_cap: 50

# Per-pair gold (1.1-style) — the count is over POINTS produced by the
# intersection, NOT over a set of entities the way 26/27/28 aggregate
# over pool_a entities. So gold provenance is just the two anchor
# entities (entity_a + entity_b). No 10.1-style aggregate gold
# extension is applicable.
gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
