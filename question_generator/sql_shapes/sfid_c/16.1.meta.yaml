tid: "16.1"
tid_family: 16
sfid: C
ssfid: 2
spatial_function: intersection_category_count
ground_truth_type: count
answer_unit: count

# entity_a_name carries the plural category label (e.g. "highways") so
# the exporter's {{entity_A}} placeholder renders grammatically. No
# entity_a_id (the category is a slot, not an entity).
result_columns:
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Single deliverable pairing: road_network_feature_category ×
# road_network_feature_instance. road_network_feature_category resolves
# to a single node_type (`highway`) per entity_constraints/class_lookup.csv,
# so this ftid ships ONE variant. (If future class_lookup additions add
# more node_types under road_network_feature_category, sibling variants
# can be added with their own entity_a_label.)
#
# All 3 KGs apply (pure topology, no per-KG sparsity).
variants:
  highway:
    description: "Count of highways intersecting an anchor road feature."
    parameters:
      entity_a_label: highways
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'road_network_feature_category'"
        pool_b:
          source: entities
          filter: "category = 'road_network_feature_category'"

# Same-country, no-self, ST_Intersects in JOIN ON for Sedona's
# RangeJoinExec recognition. Both predicates reference `geom`
# (pre-materialized in the pool_a_geom / pool_b_geom CTEs).
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND ST_Intersects(a.geom, b.geom)"

sampling:
  strategy: row_number_hash

# rand_seed_b: feeds the hash() inside the anchor ROW_NUMBER's ORDER BY,
#   so reruns with the same seed pick identical anchors per country.
# per_country_cap: 50 — caps anchors per country, keeping geographic
#   diversity across ~150 countries.
parameters:
  rand_seed_b: 67890
  per_country_cap: 50

# Aggregate gold extension (10.1-style): the COUNT depends on every
# pool_a entity matching the spatial predicate, so gold must include
# triples for ALL those entities (not just the anchor). Mirror 10.1's
# uris_to_fetch UNION pattern in 26.1.gold.sql.
#
# entity_b_id keys to pool_b — the anchor — because the SQL projects
# b.id under the entity_b_id column name. attach_question_ids_to_gold
# joins gold by entity_id == row['entity_b_id'].
gold_triples:
  pool_map:
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
