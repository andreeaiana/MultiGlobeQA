tid: "64.4"
tid_family: 64
sfid: M
ssfid: 5
spatial_function: grid_conversion_latlon
ground_truth_type: grid_cell_id
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - latlon_resolution_deg
  - value
  - ground_truth

pools:
  - pool_a

variants:
  mixed:
    description: "Latitude-longitude grid cell ID for any POI/region/natural feature anchor."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"
      worldkg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"
      kwg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"

# Single-pool unary projection — no join_condition needed.
join_condition: null

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  # Resolution in degrees. 0.01° (~1.1 km at the equator) matches the
  # ~1 km cell scale used by 64.1 (H3 res 7) and 64.3 (geohash precision 6).
  latlon_resolution_deg: 0.01

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
