tid: "63.1"
tid_family: 63
sfid: M
ssfid: 1
spatial_function: relative_position_polar
ground_truth_type: polar_coordinates
answer_unit: "degrees,km"

# Ground truth is a comma-separated "bearing_degrees,distance_km" string.
# No validator rule for polar_coordinates — falls through to valid (the
# numeric values are well-formed by construction; the rare NULL geometry
# case is dropped via the SELECT's CASE NULL guard).

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi:
    description: "Relative position of one POI from another (same h3 cell, same country)."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

# Same-cell + same-country + rank-equality (mirror of 49.1's join shape).
# h3_res3 keeps pairs geographically close so "relative position" is
# meaningful rather than e.g. "1500 km north".
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id AND a.h3_res3 = b.h3_res3"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
