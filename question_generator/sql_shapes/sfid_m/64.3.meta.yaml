tid: "64.3"
tid_family: 64
sfid: M
ssfid: 3
spatial_function: grid_conversion_geohash
ground_truth_type: grid_cell_id
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - geohash_precision
  - value
  - ground_truth

pools:
  - pool_a

variants:
  mixed:
    description: "Geohash for any POI/region/natural feature anchor."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"
      worldkg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"
      kwg:
        pool_a:
          source: entities
          filter: "category IN ('POI_category', 'region_category', 'natural_feature_category')"

join_condition: null

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  # Precision 6 yields ~1.2 km × 600 m geohash cells.
  geohash_precision: 6

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
