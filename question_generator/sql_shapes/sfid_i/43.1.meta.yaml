tid: "43.1"
tid_family: 43
sfid: I
ssfid: 1
spatial_function: event_distance
ground_truth_type: distance_kilometers
answer_unit: km

result_columns:
  - entity_a_id
  - entity_a_name
  - event_a_name
  - entity_b_id
  - entity_b_name
  - time_period
  - ground_truth

pools:
  - pool_a
  - pool_b

# KG SCOPE — kwg only.
# Hazard events are first-class only in KnowWhereGraph (NOAA / NIFC / MTBS
# entities with start_date + end_date columns populated by the nt_to_delta
# temporal extractor). osmh3kg has no hazard_event_category in its
# category vocabulary; worldkg likewise. Trying to filter
# by `category = 'hazard_event_category'` on those KGs would yield an
# empty pool_a and produce zero questions. We omit the variant rather
# than silently emit empties.
variants:
  poi:
    description: "Distance between a hazard event and a POI active in the same period."
    applicable_kgs:
      kwg:
        pool_a:
          source: entities
          filter: "category = 'hazard_event_category'"
        pool_b:
          source: entities
          filter: "category = 'POI_category'"
  region:
    description: "Distance between a hazard event and an administrative region active in the same period."
    applicable_kgs:
      kwg:
        pool_a:
          source: entities
          filter: "category = 'hazard_event_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category'"

# In-country, no-self, rank-equality (same shape as 1.1's join_condition).
# The temporal filter lives in the pool_a CTE (see SQL header for why).
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id"

sampling:
  strategy: row_number_hash

# Free-form parameters substituted into the SQL.
# rand_seed_a / rand_seed_b: independent shuffles per 1.1's pattern.
# period_start / period_end: temporal window for "active" events.
# Default 2020-01-01 to 2023-12-31 matches the kwg NOAA event
# coverage window.
parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890
  period_start: "2020-01-01"
  period_end: "2023-12-31"

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
