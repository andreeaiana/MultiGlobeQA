tid: "46.1"
tid_family: 46
sfid: I
ssfid: 1
spatial_function: event_temporal_overlap
ground_truth_type: boolean
answer_unit: null

# Event TIDs are kwg-only — knowwheregraph has explicit event entities
# with start_date / end_date attributes. osmh3kg / worldkg do not have
# event entities as first-class citizens.

result_columns:
  - entity_a_id
  - entity_a_name
  - event_a_name
  - entity_b_id
  - entity_b_name
  - event_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  hazard_event:
    description: "Did event A and event B overlap in time (same country)?"
    applicable_kgs:
      kwg:
        pool_a:
          source: entities
          # KWG event entities live under category = 'hazard_event_category'
          # with node_type indicating hazard kind (Wildfire, Flood, etc).
          filter: "category = 'hazard_event_category'"
        pool_b:
          source: entities
          filter: "category = 'hazard_event_category'"

# Same-country, no-self, rank-equality.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
