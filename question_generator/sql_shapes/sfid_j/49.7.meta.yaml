tid: "49.7"
tid_family: 49
sfid: J
ssfid: 7
spatial_function: cardinal_direction_boolean_southeast
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi:
    description: "Is POI A southeast of POI B (same h3 cell, same country)?"
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id AND a.h3_res3 = b.h3_res3"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
