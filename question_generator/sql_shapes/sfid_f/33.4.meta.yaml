tid: "33.4"
tid_family: 33
sfid: F
ssfid: 2
spatial_function: comparison
ground_truth_type: entity_single_name
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Single variant: POI_category × region_instance.
# Ranking is purely deterministic by direction + name tiebreak; no
# rand_seed needed. All four 33.x ftids (north/south/west/east) share
# the same SQL skeleton — only ORDER BY direction differs.
variants:
  poi_in_region:
    description: "Easternmost POI within a region anchor."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category'"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category'"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: entities
          filter: "category = 'region_category'"

# join_condition omitted — ST_Contains lives directly inside the SQL
# CTE, no top-level binary predicate to factor out.
join_condition: null

sampling:
  strategy: row_number_hash

# Pure per-entity-pair gold (1.1-style): ground truth is the picked
# entity_a, anchored by the reference region entity_b. Both get
# label/type/geometry triples.
gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
