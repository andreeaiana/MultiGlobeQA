tid: "26.1"
tid_family: 26
sfid: D
ssfid: 1
spatial_function: set_enumeration
# set_enumeration: validator expects ground_truth to be a JSON-array-shaped
# string (startswith '['). Main SQL emits to_json(sort_array(collect_set(name)))
# so this is satisfied for both non-empty and zero-match anchors ('[]').
ground_truth_type: set_enumeration
answer_unit: null

result_columns:
  # entity_a_name carries the PLURAL category label (e.g. 'cafes') so the
  # exporter's {{entity_A}} placeholder substitutes correctly. Without
  # this, the rendered question reads "Which Entity A does Entity B
  # pass by?".
  - entity_a_name
  - entity_a_subcategory
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# One variant per POI category, covering the four most-common categories
# (cafe, restaurant, pharmacy, bank). Long-tail categories (fuel,
# fast_food, memorial, hotel, ...) are not declared here; each one needs
# its own variant block to be generated.
#
# pool_a: ALL POIs of the relevant entity category (further narrowed by the
#   join's `node_type = '{entity_a_category}'` filter). Source = entities.
# pool_b: per-session aggregated road view. Source =
#   osmh3kg_roads_aggregated. The empty filter is intentional — every
#   row in the view IS a named road; no further category narrowing needed
#   here. (Per-road-class restriction can later be added by setting
#   filter: "node_type = 'primary'" etc.)
#
# KG SCOPE: osmh3kg-only. The aggregated road view is
# osmh3kg-only (kwg has no road sub-category labels; worldkg coverage
# TBD). worldkg / kwg are intentionally absent from applicable_kgs;
# add them once the road view supports the additional KG.
variants:
  cafe:
    description: "Which cafes does {{entity_B}} pass by?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: osmh3kg_roads_aggregated
          filter: ""
  restaurant:
    description: "Which restaurants does {{entity_B}} pass by?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: osmh3kg_roads_aggregated
          filter: ""
  pharmacy:
    description: "Which pharmacies does {{entity_B}} pass by?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: osmh3kg_roads_aggregated
          filter: ""
  bank:
    description: "Which banks does {{entity_B}} pass by?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'POI_category'"
        pool_b:
          source: osmh3kg_roads_aggregated
          filter: ""

# join_condition is encoded INLINE in the SQL (not via {join_condition})
# because this TID's predicate uses two different aliases (b for the
# anchor outer side, a for the inner LEFT-JOINed pool) and ST_DWithin
# benefits from being inlined in JOIN ON for Sedona's optimizer to
# spot the spatial-join pattern. Setting join_condition: null tells
# the contract checker to skip the {join_condition} placeholder check.
join_condition: null

sampling:
  strategy: row_number_hash

# Sampling: hash-diversity anchor selection, NOT `ORDER BY RAND()`.
# pool_b_capped applies
# `ROW_NUMBER() OVER (PARTITION BY country_iso3 ORDER BY hash(id, rand_seed_b))`
# and filters to rank <= {per_country_cap}. This keeps anchors balanced
# across countries (~per_country_cap per country) instead of concentrating
# on whichever country has the most named roads (USA dominates osmh3kg).
# The outer LIMIT {total_sample} caps the global row count after the
# LEFT JOIN + collect_set GROUP BY.
#
# Two category parameters: {entity_a_category} is the SINGULAR node_type
# value (used in the join filter — must match the data verbatim);
# {entity_a_category_label} is the PLURAL noun phrase rendered into the
# question text (used as `entity_a_name` to drive the exporter's
# {{entity_A}} placeholder). Without separating them the rendered
# question would be ungrammatical.
#
# {proximity_buffer_meters} is the proximity radius IN METRES. The SQL
# multiplies by 0.00001 to convert to planar degrees for ST_DWithin
# (1m ≈ 9e-6° at the equator; rounds to 0.00001 conservatively). 100m
# default. This parameter is NOT surfaced
# in the question text — the question is "does road X pass by …", not
# "is within 100m of …". Via the per-KG override mechanism,
# a one-line `parameters_per_kg.kwg.proximity_buffer_meters: 250` can
# widen the buffer for sparser KGs once kwg is wired in; it is not set
# here because only osmh3kg is declared in applicable_kgs.
#
# {per_country_cap} bounds anchors per country in the diversity-sampled
# pool_b. Default 10: with ~150 countries this caps total anchors at
# ~1,500 — well below the default total_sample of 5,000 so the
# per-country cap is the binding constraint (deliberate: roads are
# numerous and we want anchor variety, not depth).
#
# {rand_seed_b} feeds the hash() inside the anchor ROW_NUMBER's
# ORDER BY, so reruns with the same seed pick identical anchors per
# country.
parameters:
  rand_seed_b: 67890
  per_country_cap: 10
  entity_a_category: cafe
  entity_a_category_label: cafes
  proximity_buffer_meters: 100

# GOLD-PROVENANCE CHOICE — option (a): single-row-per-question with
# anchor-only pool_map ({entity_b_id: pool_b}).
#
# The 26.1 main SQL aggregates many `a.id` values into a JSON list per
# anchor (collect_set + to_json), so each output row has exactly one
# pool_b entity (the road) and a SET of pool_a entities (the matched
# POIs). Mirrors 11.1's choice (option a):
#
#   - Single-row-per-question matches the structural shape of 11.1
#     (the sibling set TID — same answer-shape).
#   - Aggregate queries need full provenance, so gold coverage must not
#     be truncated. The gold.sql UNIONs the anchor URI with every nearby
#     POI URI inside the proximity buffer — identical predicate to the
#     main SQL — so all triples backing the answer set ARE captured
#     (just not split per row). The validator/exporter joins them all
#     to the same question_id.
#   - No per-entity ROW_NUMBER cap on gold_triples.
gold_triples:
  pool_map:
    # Single-role gold: anchor (road) is the only sampled per-row entity.
    # The matched POIs are aggregated into the answer string; their
    # triples are still emitted (see gold.sql) and attributed to the
    # anchor's id so they share the question_id.
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
