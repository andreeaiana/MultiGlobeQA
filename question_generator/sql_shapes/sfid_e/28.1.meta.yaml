tid: "28.1"
tid_family: 28
sfid: E
ssfid: 1
spatial_function: admin_containment_boolean
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  any_admin:
    description: "Is admin polygon A administratively part of admin polygon B (any admin level)?"
    # SYMMETRIC pool design: both pools are the full set of polygon admin
    # entities for the KG. Geometric containment (ST_Contains in SELECT)
    # decides true/false naturally — no admin-level asymmetry needed.
    # Question is well-defined in either direction:
    #   - "Is Bavaria part of Germany?" → ST_Contains(Germany, Bavaria) = true
    #   - "Is Germany part of Bavaria?" → ST_Contains(Bavaria, Germany) = false
    #   - "Is Bavaria part of California?" → false (random unrelated pair)
    # A model that always answers based on "which name sounds bigger"
    # should fail — the SQL forces actual geometric reasoning.
    #
    # KG filters reflect each KG's own admin vocabulary:
    #   - osmh3kg: node_type = 'administrative' (the generic OSM
    #     boundary=administrative tag covers 97.6% of polygon admins;
    #     no admin_level discrimination needed thanks to the symmetric
    #     design).
    #   - kwg: node_type IN ('AdministrativeRegion_1', 'AdministrativeRegion_2')
    #     (states + counties; excludes ZipCodeArea, StatisticalArea, etc.
    #     which aren't traditional admin regions).
    # worldkg is excluded — its region entities are POINT geometries,
    # so polygon containment can't apply at all.
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON') AND node_type = 'administrative'" }
        pool_b: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON') AND node_type = 'administrative'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON') AND node_type IN ('AdministrativeRegion_1', 'AdministrativeRegion_2')" }
        pool_b: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON') AND node_type IN ('AdministrativeRegion_1', 'AdministrativeRegion_2')" }

# In-country, no-self join. NO rank-equality (different from TID 1.1's
# sampling pattern) — instead the SQL cross-joins all in-country admin
# pairs, computes ST_Contains, and samples target_true_count true pairs +
# target_false_count false pairs separately. This produces a class-
# balanced distribution (false-premise injection) rather than a heavily
# skewed natural distribution.
#
# Sampling math (per KG, after country sub-sample):
#   - osmh3kg: ~5K admin polygons per country (admin-level mix). Cross-
#     join product ~25M pairs per country. ST_Contains is heavy on this
#     pool size; expect 1-3 min wall clock per cell.
#   - kwg: ~3K admin polygons per country (US dominant). Cross-join ~9M
#     pairs per country. Wall clock ~30s per cell.
# In both cases TRUE-pair supply is plentiful: every admin contained-by
# its parent admin contributes one TRUE pair; transitive containment
# (city in county in state in country) gives multiple TRUE pairs per
# entity. At target_true_count=25 + target_false_count=25 the smoke
# easily fills both classes.
#
# This variant declares no valid_pairings field (a full admin-hierarchy
# ordering: neighbourhood ⊂ city ⊂ county ⊂ state ⊂ country) and does
# not need one — the symmetric design captures all admin levels at
# once and lets ST_Contains discriminate. A future variant could use
# valid_pairings to enforce a SPECIFIC level pairing if a TID requires
# it, but for the broad "is A administratively part of B" question, the
# symmetric design is cleaner.
# PERFORMANCE: ST_Intersects is included in the JOIN (not the WHERE) so
# Sedona can pushdown via SpatialJoin (R-tree index, O(N log N) instead
# of O(N²) nested-loop). For US (3K counties × 50 states = 150K cross-
# pairs nested-loop), ST_Intersects pre-filter survives ~70 pairs per
# state (≤60 contained counties + a few adjacent border-touching ones)
# = ~4K candidate pairs total. ST_Contains then runs on those ~4K
# instead of 150K, AND Catalyst's filter-pushdown CASE inlining (which
# evaluated ST_Contains up to 4× per pair) costs proportionally less.
# Without this pre-filter, smoke wall clock balloons to 60+ min on kwg
# alone: the physical plan then carries 4 redundant ST_Contains
# evaluations per pair from inlined WHERE filters.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id"

sampling:
  strategy: row_number_hash

parameters:
  # No hash seed — sampling is per-class WHERE + LIMIT (no ORDER BY).
  # Determinism comes from Spark partition order being stable across reruns
  # given the same input data.
  # Class-balanced sampling targets. Sum should equal total_sample if
  # you want a full benchmark cell; here 25 + 25 = 50 matches the smoke
  # default. For other cell sizes, scale these proportionally
  # (e.g. total_sample=100 → 50/50, total_sample=200 → 100/100).
  target_true_count: 25
  target_false_count: 25

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
