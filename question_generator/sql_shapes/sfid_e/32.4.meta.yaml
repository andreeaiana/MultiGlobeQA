tid: "32.4"
tid_family: 32
sfid: E
ssfid: 3
spatial_function: ranked_containment_shortest_length
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - entity_c_id
  - entity_c_name
  - ground_truth

pools:
  - pool_a
  - pool_b
  - pool_c

variants:
  natural_feature_in_region:
    description: "Does region A fully contain the shortest natural feature B inside region C?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING', 'POLYGON', 'MULTIPOLYGON')"
        pool_c:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
      kwg:
        pool_a:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category = 'natural_feature_category' AND geometry_type IN ('LINESTRING', 'MULTILINESTRING', 'POLYGON', 'MULTIPOLYGON')"
        pool_c:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"

# 2026-05 refactor: country-equality + id-exclusions moved into the SQL
# directly (WHERE clauses) so the join keys can be split — country eq
# in WHERE keeps Sedona's RangeJoinExec active on the spatial JOIN ON.
# The previous {join_condition} substitution forced country_iso3 into
# JOIN ON, which selected SortMergeJoin and serialized ST_Contains.
join_condition: null

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_c: 67890
  per_country_cap: 50
  target_true_count: 25
  target_false_count: 25

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
    entity_c_id: pool_c
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
