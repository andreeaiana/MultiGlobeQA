tid: "30.6"
tid_family: 30
sfid: E
ssfid: 2
spatial_function: collection_count_cinemas_theatres_museums
ground_truth_type: count
answer_unit: count

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

# Per-KG POI vocabulary alignment (Cat 2 fix, Tier 2 Spark coverage scan
# 2026-05-04):
#   - osmh3kg: lowercase OSM amenity tags (cinema/theatre/museum —
#     15,391 POIs combined).
#   - worldkg: PascalCase WorldKG ontology classes (Cinema/Theatre/Museum
#     — 90,002 combined).
#   - kwg: DROPPED. kwg's POI vocabulary covers only Pharmacy + BPHC_Site;
#     entertainment/cultural entities are not represented in the KG.
variants:
  region_pois:
    description: "How many cinemas, theatres and museums are in {{entity_A}}?"
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category = 'POI_category' AND node_type IN ('cinema', 'theatre', 'museum')"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category = 'POI_category' AND node_type IN ('Cinema', 'Theatre', 'Museum')"

join_condition: "a.country_iso3 = b.country_iso3 AND ST_Contains(a.geom, b.geom)"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  collection_label: "cinemas, theatres and museums"

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
