tid: "32.5"
tid_family: 32
sfid: E
ssfid: 7
spatial_function: ranked_containment_most_populated
# DEPENDENCY: pop_tiles view must be registered (raster_setup.py at
# session bootstrap; requires POPULATION_RASTER_PATH file present).
# Sibling 32.6 has the same dependency.
ground_truth_type: boolean
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - entity_c_id
  - entity_c_name
  - ground_truth

# Three pools: A = candidate container regions, B = features being ranked,
# C = ranking-context regions (the rank-1 of B inside C is the candidate).
pools:
  - pool_a
  - pool_b
  - pool_c

variants:
  region_features_in_region:
    description: "Does region A fully contain the largest region/feature B inside region C?"
    # All three pools are polygon-bearing region/natural-feature entities.
    # The ranking metric (ST_Area) requires polygon geometries.
    # worldkg excluded: its region entities are POINT geometries.
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_c:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
      kwg:
        pool_a:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_b:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
        pool_c:
          source: entities
          filter: "category IN ('region_category', 'natural_feature_category') AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"

# Three-way same-country join. The container (a) and ranking context (c)
# may be the same entity: there is deliberately no a.id != rf.container_id
# constraint, because the question "Does C fully contain its own largest
# feature?" is well-defined and yields meaningful TRUE answers.
# We DO disallow entity_b being the same as the container or context to
# avoid trivial self-containment.
# The country equality and the id exclusions sit in the SQL's WHERE
# clauses so RangeJoinExec stays active on the spatial JOIN ON.
# pool_c is per-country hash-sampled and pool_b is country-pruned
# before the spatial join (mirror of 32.4).
join_condition: null
sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_c: 67890
  per_country_cap: 50
  target_true_count: 25
  target_false_count: 25

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
    entity_c_id: pool_c
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
