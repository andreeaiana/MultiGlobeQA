tid: "57.1"
tid_family: 57
sfid: K
ssfid: 3
spatial_function: irregularity_perimeter_area_ratio
ground_truth_type: numeric
answer_unit: per_meter

result_columns:
  - entity_a_id
  - entity_a_name
  - value
  - ground_truth

pools:
  - pool_a

variants:
  region:
    description: "Perimeter-to-area ratio of a region polygon at {value} km simplification."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

  natural_feature:
    description: "Perimeter-to-area ratio of a natural-feature polygon at {value} km simplification."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

# Single-pool. Same pattern as 37.1.
sampling:
  strategy: row_number_hash

# `value` is the simplification tolerance in km — registry range [0.1, 10.0].
# Default 1.0 km picks the geometric midpoint on a log scale (log10(0.1)=-1,
# log10(10)=1; midpoint = 0). Per-question variation is not yet supported by
# the shape executor — the meta-default fixes a single tolerance per cell run
# (consistent with how rand_seed_a is treated). Future per-question
# parameterization can override this via run-spec.
parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  value: 1.0

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
