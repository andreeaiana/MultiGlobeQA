tid: "57.4"
tid_family: 57
sfid: K
ssfid: 7
spatial_function: irregularity_boundary_roughness
ground_truth_type: numeric
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - value
  - ground_truth

pools:
  - pool_a

variants:
  region:
    description: "Boundary roughness index of a region polygon at {value} km smoothing reference."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

  natural_feature:
    description: "Boundary roughness index of a natural-feature polygon at {value} km smoothing reference."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

sampling:
  strategy: row_number_hash

# BRI = Perimeter(fine = value/2) / Perimeter(coarse = value*2). Higher
# ratio = rougher boundary (more detail lost at coarser scale). Range
# [0.5, 10.0]; default 2.0 km (geometric midpoint of [0.5, 10] log-scale).
parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  value: 2.0

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
