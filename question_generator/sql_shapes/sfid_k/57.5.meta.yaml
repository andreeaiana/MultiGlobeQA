tid: "57.5"
tid_family: 57
sfid: K
ssfid: 8
spatial_function: irregularity_vertices_per_km
ground_truth_type: numeric
answer_unit: per_km

result_columns:
  - entity_a_id
  - entity_a_name
  - value
  - ground_truth

pools:
  - pool_a

variants:
  region:
    description: "Vertices per kilometre of a region polygon at {value} km sampling interval."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

  natural_feature:
    description: "Vertices per kilometre of a natural-feature polygon at {value} km sampling interval."
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }
      kwg:
        pool_a: { source: entities, filter: "category = 'natural_feature_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')" }

sampling:
  strategy: row_number_hash

# vertices/km on a topology-preserving simplified polygon. Range [0.01, 5.0];
# default 0.5 km (geometric midpoint of [0.01, 5.0] log-scale).
parameters:
  rand_seed_a: 12345
  per_country_cap: 50
  value: 0.5

gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
