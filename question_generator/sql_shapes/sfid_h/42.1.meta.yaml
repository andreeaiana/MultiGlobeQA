tid: "42.1"
tid_family: 42
sfid: H
ssfid: 2
spatial_function: multi_index_finest_cover
# qualitative: ground_truth is a composite string
#   "H3(res=R): <cell> | S2(lvl=L): <cell>"
# Multi-column GT support is deferred; downstream can split on " | "
# then ": " for structured access.
ground_truth_type: qualitative
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - ground_truth

# Single-pool TID: only pool_a is declared (region anchors). The executor
# handles single-pool via the dynamic meta.pools loop.
pools:
  - pool_a

variants:
  region:
    description: "Finest single H3 cell + S2 cell that fully covers a region polygon."
    applicable_kgs:
      osmh3kg:
        pool_a:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
      worldkg:
        pool_a:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"
      kwg:
        pool_a:
          source: entities
          filter: "category = 'region_category' AND geometry_type IN ('POLYGON', 'MULTIPOLYGON')"

# No join — single-pool unary aggregation. join_condition omitted.

# Sampling: per-country ROW_NUMBER hash-diversity (mirrors 37.1's pattern).
# The SQL builds bucket ranks via
#   ROW_NUMBER OVER (PARTITION BY country_iso3 ORDER BY hash(id, rand_seed_a))
# and caps each country at {per_country_cap}, then bounds the global
# result with the outer LIMIT {total_sample}.
sampling:
  strategy: row_number_hash

# {per_country_cap}: default 50 (matches 37.1 / 12.1). The cross-join
# over the resolution arrays (16 H3 + 21 S2 candidate cells per anchor)
# makes per-anchor cost noticeably higher than 37.1's centroid extract,
# so this cap acts as the primary load brake — tune downward if planet-
# scale runs hit Sedona-level memory pressure on the cell-polygon
# materialization.
#
# {rand_seed_a}: feeds hash() inside the anchor ROW_NUMBER's ORDER BY,
# so reruns with the same seed pick identical anchors per country.
parameters:
  rand_seed_a: 12345
  per_country_cap: 50

# Gold triples extracted for the single picked region per row.
gold_triples:
  pool_map:
    entity_a_id: pool_a
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
