tid: "40.1"
tid_family: 40
sfid: H
ssfid: 1
spatial_function: shared_grid_cell
# grid_cell_id: validator only checks non-null. Output is the h3_res3 cell
# ID (string) that both entities share by construction of join_condition.
ground_truth_type: grid_cell_id
answer_unit: null

result_columns:
  - entity_a_id
  - entity_a_name
  - entity_b_id
  - entity_b_name
  - ground_truth

pools:
  - pool_a
  - pool_b

variants:
  poi:
    description: "Which H3 grid cell (resolution 3) contains both POI A and POI B?"
    applicable_kgs:
      osmh3kg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      worldkg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }
      kwg:
        pool_a: { source: entities, filter: "category = 'POI_category'" }
        pool_b: { source: entities, filter: "category = 'POI_category'" }

# Same join shape as TID 49.1's poi variant — pairs are in-country, same
# h3_res3 cell, no self-pair. NOTE: TID 1.1's poi variant DROPPED the
# h3_res3 equality from its join_condition (allowing same-country
# cross-cell pairs) — 40.1 and 49.1 deliberately keep it because the
# question semantics require co-location (40.1's "shared cell" GT and
# 49.1's "north-of in same neighborhood" computation). So this is a
# principled divergence from 1.1, not a stale copy.
#
# The ground_truth in the SELECT is just a.h3_res3 (== b.h3_res3 by
# virtue of the join), so this is a degenerate but valid test of
# qualitative string GT flowing through validator and exporter.
join_condition: "a.country_iso3 = b.country_iso3 AND a.id != b.id AND a.unique_id = b.unique_id AND a.h3_res3 = b.h3_res3"

sampling:
  strategy: row_number_hash

parameters:
  rand_seed_a: 12345
  rand_seed_b: 67890

gold_triples:
  pool_map:
    entity_a_id: pool_a
    entity_b_id: pool_b
  predicates:
    - label
    - type
    - geometry_link
    - geometry_wkt

defaults:
  total_sample: 5000
  run_seed: 12345
