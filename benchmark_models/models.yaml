# Tier-3 -name variants for gemini (text-only baselines for the
# image-vs-name ablation at the tool-augmented tier). The
# ``[IMAGE_<slot>]`` placeholder is substituted with the entity's
# textual name before the agent loop kicks off, so the model sees
# only text + its KG/web tools — comparable to running tier-3 on the
# regular non-multimodal share but with the multimodal slice's
# specific question distribution. The gap to the matching -image
# variant is the visual-grounding signal under tool augmentation.
gemini-3-flash-tier3a-name:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: tool_agent
  sub_tier: "3a"
  multimodal_mode: "name"

gemini-3-flash-tier3b-name:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: tool_agent
  sub_tier: "3b"
  multimodal_mode: "name"

gemini-3-flash-tier3c-name:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: tool_agent
  sub_tier: "3c"
  multimodal_mode: "name"

# ============================================================================
# Open-weights (vLLM) — tier 1
# ============================================================================

qwen35-a3b-plain:
  <<: *qwen35_a3b_defaults
  tier: plain
  batch_size: 64

qwen35-27b-plain:
  <<: *qwen35_27b_defaults
  tier: plain
  batch_size: 32

gemma-3-27b-it-plain:
  <<: *gemma3_27b_defaults
  tier: plain

# ============================================================================
# Open-weights (vLLM) — tier 2 (reasoning / thinking)
# ============================================================================

qwen35-a3b-thinking-tier2:
  <<: *qwen35_a3b_defaults
  tier: reasoning
  thinking: true
  batch_size: 64

# Qwen3.5-27B and Gemma 3 27B both use prompted CoT (neither has a
# native thinking toggle). SC@3 is applied only on the workhorse
# Qwen3.5-35B-A3B-FP8 variant above; these two use greedy CoT.

qwen35-27b-tier2:
  <<: *qwen35_27b_defaults
  tier: reasoning
  batch_size: 32

gemma-3-27b-it-tier2:
  <<: *gemma3_27b_defaults
  tier: reasoning

