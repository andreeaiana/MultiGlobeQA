# Variant catalogue for benchmark_models.
#
# Each top-level key is a variant name; the value is a VariantConfig
# validated by benchmark_models/config.py. The runner loads this file
# at startup via load_models_catalogue() and constructs Model instances
# from the entries. Keys starting with ``_`` are treated as YAML-anchor
# templates and skipped by the loader (so e.g. ``_qwen35_a3b_defaults``
# is a config block we can ``<<: *qwen35_a3b_defaults`` into multiple
# variants without each anchor becoming a phantom variant).
#
# Backends: google (Gemini API), vllm_http (self-hosted open weights).
# ``backends/openai.py`` ships as the OpenAI-compatible base class that
# vllm_http builds on; add an ``openai`` variant here to target a hosted
# OpenAI-compatible endpoint.
# Tiers: plain (tier 1), reasoning (tier 2), tool_agent (tier 3)
#
# Install: uv sync --extra benchmark_models

# ============================================================================
# YAML anchor templates (loader filters keys starting with ``_``).
# ============================================================================

_qwen35_a3b_defaults: &qwen35_a3b_defaults
  backend: vllm_http
  model_path: Qwen/Qwen3.5-35B-A3B-FP8
  dtype: auto
  gpu_memory_utilization: 0.9

_gemma3_27b_defaults: &gemma3_27b_defaults
  backend: vllm_http
  model_path: google/gemma-3-27B-it
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  # Pinned to Gemma 3 27B (rather than Gemma 4 31B) because the
  # current pinned ``transformers`` (4.57.x) doesn't register the
  # ``gemma4`` model_type — that needs transformers ≥ 5.5.0, which
  # in turn requires the vLLM nightly. Gemma 3 has been supported
  # since vLLM 0.18 with our transformers version, so the swap
  # keeps the open-weights Gemma data point in the catalogue without
  # a dependency-stack overhaul. The trade-off is that Gemma 3 has
  # no native ``thinking`` toggle, so its tier-2 variant falls back
  # to prompted CoT (see the ``gemma-3-27b-it-tier2`` entry below).

_qwen35_27b_defaults: &qwen35_27b_defaults
  backend: vllm_http
  model_path: Qwen/Qwen3.5-27B-FP8
  dtype: auto

# YaRN-extended context for qwen35-27b tier-3a / tier-3c only. Native
# 32 K is fine for tier-1, tier-2, and tier-3b — those are single-turn
# or web-only. Tier-3a/3c use-kg agent loops grow per-step input by
# ~5–7 K tokens (cumulative tool outputs reaccumulated each turn), so
# 32 K runs out before the agent converges. Extending to 65 K via YaRN
# (factor=2.0) is the standard inference-time technique documented on
# the Qwen3.5 model card; perplexity hit is well under 1 % in the
# 28 K–60 K regime where these loops actually live.
#
# At 65 K context with the default ``max_num_seqs: 64``, the KV cache
# would be ~80 GiB on GPU and roughly the same CPU shadow — that broke
# the 80 GiB SLURM ``--mem`` limit on Helix and SLURM OOM-killed the
# step. We use ``max_num_seqs: 16`` (the agent never has more than 4
# requests in flight given ``--batch-size 1`` + ``--max-concurrent 4``,
# so 16 is generous) and ``slurm_mem_gb: 128`` to give a comfortable
# system-RAM buffer.
_qwen35_27b_yarn_64k: &qwen35_27b_yarn_64k
  max_model_len: 65536
  max_num_seqs: 16
  slurm_mem_gb: 128
  rope_scaling:
    rope_type: yarn
    factor: 2.0
    original_max_position_embeddings: 32768

