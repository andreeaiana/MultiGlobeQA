# ============================================================================
# Open-weights tier-3 multimodal — image vs name ablation
# ============================================================================
#
# Tier-3 multimodal pairs the agent loop with either real image input
# (-image) or a text-only baseline where ``[IMAGE_<slot>]`` is
# substituted with the entity's textual name (-name). The image-vs-name
# gap quantifies how much the visual modality contributes when the
# model also has KG/web tool access. All three open-weights models are
# vision-capable per their HF model cards
# (``pipeline_tag: image-text-to-text``, ``vision_config`` block).
#
# qwen35-27b-tier3a/c-{image,name} carry the YaRN 64K context
# extension (same as the text-only -tier3a / -tier3c variants) since
# the agent loop's per-step input growth is independent of multimodal
# mode — image inputs add ~1.5K tokens per step on top of the existing
# 5-7K cumulative tool-output bloat. 3b stays at native 32K (web-only,
# smaller per-tool outputs).

qwen35-a3b-tier3a-image:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3a"
  multimodal_mode: "image"

qwen35-a3b-tier3a-name:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3a"
  multimodal_mode: "name"

qwen35-a3b-tier3b-image:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3b"
  multimodal_mode: "image"

qwen35-a3b-tier3b-name:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3b"
  multimodal_mode: "name"

qwen35-a3b-tier3c-image:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3c"
  multimodal_mode: "image"

qwen35-a3b-tier3c-name:
  <<: *qwen35_a3b_defaults
  tier: tool_agent
  sub_tier: "3c"
  multimodal_mode: "name"

qwen35-27b-tier3a-image:
  <<: [*qwen35_27b_defaults, *qwen35_27b_yarn_64k]
  tier: tool_agent
  sub_tier: "3a"
  multimodal_mode: "image"

qwen35-27b-tier3a-name:
  <<: [*qwen35_27b_defaults, *qwen35_27b_yarn_64k]
  tier: tool_agent
  sub_tier: "3a"
  multimodal_mode: "name"

qwen35-27b-tier3b-image:
