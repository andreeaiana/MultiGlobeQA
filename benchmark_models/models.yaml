# Variant catalogue for benchmark_models.
#
# Each top-level key is a variant name; the value is a VariantConfig
# validated by benchmark_models/config.py. The runner loads this file
# at startup via load_models_catalogue() and constructs Model instances
# from the entries. Keys starting with ``_`` are treated as YAML-anchor
# templates and skipped by the loader (so e.g. ``_qwen35_a3b_defaults``
# is a config block we can ``<<: *qwen35_a3b_defaults`` into multiple
# variants without each anchor becoming a phantom variant).
#
# Backends: google (Gemini API), vllm_http (self-hosted open weights).
# ``backends/openai.py`` ships as the OpenAI-compatible base class that
# vllm_http builds on; add an ``openai`` variant here to target a hosted
# OpenAI-compatible endpoint.
# Tiers: plain (tier 1), reasoning (tier 2), tool_agent (tier 3)
#
# Install: uv sync --extra models

# ============================================================================
# YAML anchor templates (loader filters keys starting with ``_``).
# ============================================================================

_qwen35_a3b_defaults: &qwen35_a3b_defaults
  backend: vllm_http
  model_path: Qwen/Qwen3.5-35B-A3B-FP8
  dtype: auto
  gpu_memory_utilization: 0.9

_gemma3_27b_defaults: &gemma3_27b_defaults
  backend: vllm_http
  model_path: google/gemma-3-27B-it
  dtype: bfloat16
  gpu_memory_utilization: 0.90
  # Gemma 3 has no native thinking toggle, so its tier-2 variant uses
  # prompted CoT (see the ``gemma-3-27b-it-tier2`` entry below).

_qwen35_27b_defaults: &qwen35_27b_defaults
  backend: vllm_http
  model_path: Qwen/Qwen3.5-27B-FP8
  dtype: auto

# YaRN-extended context for qwen35-27b tier-3a / tier-3c only. Native
# 32 K is fine for tier-1, tier-2, and tier-3b — those are single-turn
# or web-only. Tier-3a/3c use-kg agent loops grow per-step input by
# ~5–7 K tokens (cumulative tool outputs reaccumulated each turn), so
# 32 K runs out before the agent converges. Extending to 65 K via YaRN
# (factor=2.0) is the standard inference-time technique documented on
# the Qwen3.5 model card; perplexity hit is well under 1 % in the
# 28 K–60 K regime where these loops actually live.
#
# At 65 K context with the default ``max_num_seqs: 64``, the KV cache
# would be ~80 GiB on GPU and roughly the same CPU shadow, which
# exceeds an 80 GiB scheduler memory limit and gets the step OOM-killed.
# We use ``max_num_seqs: 16`` (the agent never has more than 4
# requests in flight given ``--batch-size 1`` + ``--max-concurrent 4``,
# so 16 is generous) and ``slurm_mem_gb: 128`` to give a comfortable
# system-RAM buffer.
_qwen35_27b_yarn_64k: &qwen35_27b_yarn_64k
  max_model_len: 65536
  max_num_seqs: 16
  slurm_mem_gb: 128
  rope_scaling:
    rope_type: yarn
    factor: 2.0
    original_max_position_embeddings: 32768

# Models with native reasoning (Qwen 3.8, Gemma 4, gpt-oss, GLM-4.7-Flash).
# They serve at their native context window; no ``rope_scaling`` override
# is set. ``reasoning_parser`` is the ``--reasoning-parser`` name to serve
# the model with. With a parser, the JSON-schema grammar applies only after
# the reasoning channel ends. Without one, vLLM applies the grammar from the
# first generated token and suppresses thinking.

_qwen38_27b_defaults: &qwen38_27b_defaults
  backend: vllm_http
  model_path: Qwen/Qwen3.8-27B-FP8
  dtype: auto
  gpu_memory_utilization: 0.9
  max_model_len: 262144
  slurm_mem_gb: 128
  reasoning_parser: qwen3
  # Compact-JSON grammar: forbids unbounded whitespace between JSON tokens.
  vllm_extra_args: ["--structured-outputs-config '{\"backend\": \"xgrammar\", \"disable_any_whitespace\": true}'"]

_gemma4_31b_defaults: &gemma4_31b_defaults
  backend: vllm_http
  model_path: google/gemma-4-31B-it
  dtype: bfloat16
  gpu_memory_utilization: 0.9
  # Lower to 131072 if vLLM cannot allocate the KV cache at this length.
  max_model_len: 262144
  slurm_mem_gb: 128
  reasoning_parser: gemma4
  # Pins the model revision. The second argument is the compact-JSON grammar.
  vllm_extra_args:
    - "--revision 842da3794eaa0b77d5f08bae87a17459d91ff475"
    - "--structured-outputs-config '{\"backend\": \"xgrammar\", \"disable_any_whitespace\": true}'"

_gptoss_120b_defaults: &gptoss_120b_defaults
  backend: vllm_http
  model_path: openai/gpt-oss-120b
  dtype: auto
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  slurm_mem_gb: 128
  reasoning_parser: openai_gptoss
  # The upstream gpt-oss serving recipe disables prefix caching.
  disable_prefix_caching: true
  # Compact-JSON grammar: forbids unbounded whitespace between JSON tokens.
  vllm_extra_args: ["--structured-outputs-config '{\"backend\": \"xgrammar\", \"disable_any_whitespace\": true}'"]

_gptoss_20b_defaults: &gptoss_20b_defaults
  backend: vllm_http
  model_path: openai/gpt-oss-20b
  dtype: auto
  gpu_memory_utilization: 0.9
  max_model_len: 131072
  slurm_mem_gb: 80
  reasoning_parser: openai_gptoss
  disable_prefix_caching: true
  # Compact-JSON grammar: forbids unbounded whitespace between JSON tokens.
  vllm_extra_args: ["--structured-outputs-config '{\"backend\": \"xgrammar\", \"disable_any_whitespace\": true}'"]

_glm47_flash_defaults: &glm47_flash_defaults
  backend: vllm_http
  model_path: zai-org/GLM-4.7-Flash
  dtype: bfloat16
  gpu_memory_utilization: 0.9
  max_model_len: 202752
  slurm_mem_gb: 128
  # ``glm45`` is the reasoning-parser name for GLM-4.7 on vLLM 0.20.1
  # (``glm47`` exists there only as a tool parser).
  reasoning_parser: glm45
  # Compact-JSON grammar: forbids unbounded whitespace between JSON tokens.
  vllm_extra_args: ["--structured-outputs-config '{\"backend\": \"xgrammar\", \"disable_any_whitespace\": true}'"]

_qwen38_thinking_off: &qwen38_thinking_off
  chat_template_kwargs:
    enable_thinking: false
    preserve_thinking: false

_glm_thinking_off: &glm_thinking_off
  chat_template_kwargs:
    enable_thinking: false

