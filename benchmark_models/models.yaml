  tier: reasoning
  multimodal_mode: name

# ============================================================================
# Open-weights (vLLM) with native reasoning — tiers 1, 2 and 3
# ============================================================================
#
# Thinking control per family:
#   * qwen38 / glm47-flash: the chat template opens a think block by
#     default; variants without thinking pass
#     ``chat_template_kwargs: {enable_thinking: false}``.
#   * gemma4: thinking is off by default; the thinking variants enable it.
#   * gptoss: reasoning cannot be disabled, only bounded, through
#     ``request_reasoning_effort``: low (tier 1, tier 3) or high (tier 2).

# ---- Qwen 3.8 27B -----------------------------------------------------------

qwen38-27b-plain:
  boolean_literal_hint: true
  <<: [*qwen38_27b_defaults, *qwen38_thinking_off]
  tier: plain
  batch_size: 32

qwen38-27b-thinking-tier2:
  # Native thinking: the answer is JSON only and the reasoning stays in
  # the thinking channel. ``max_tokens`` covers thinking plus answer.
  boolean_literal_hint: true
  <<: *qwen38_27b_defaults
  tier: reasoning
  batch_size: 32
  schema_reasoning: false
  max_tokens: 32768

qwen38-27b-tier3a:
  <<: [*qwen38_27b_defaults, *qwen38_thinking_off]
