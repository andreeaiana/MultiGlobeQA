  thinking_level: minimal
  tier: tool_agent
  sub_tier: "3b"

gemini-3-flash-tier3c:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: tool_agent
  sub_tier: "3c"

gemini-3-flash-thinking-tier2:
  backend: google
  model_id: gemini-3-flash-preview
