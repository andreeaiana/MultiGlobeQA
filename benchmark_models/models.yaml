# ============================================================================
# Multimodal (tier 1) — image vs name ablation
# ============================================================================
#
# Each slate model gets two companion variants. ``-image`` packs the
# extracted JPEG/PNG bytes into a provider-specific content block;
# ``-name`` substitutes the entity's display name into the
# ``[IMAGE_<slot>]`` placeholder for a text-only baseline. Pair-wise
# EM gap = visual contribution.

gemini-3-flash-image:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: plain
  multimodal_mode: image

gemini-3-flash-name:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: minimal
  tier: plain
  multimodal_mode: name

qwen35-27b-image:
  <<: *qwen35_27b_defaults
  tier: plain
  multimodal_mode: image

qwen35-27b-name:
  <<: *qwen35_27b_defaults
  tier: plain
  multimodal_mode: name

qwen35-a3b-image:
  <<: *qwen35_a3b_defaults
  tier: plain
  multimodal_mode: image

qwen35-a3b-name:
  <<: *qwen35_a3b_defaults
  tier: plain
  multimodal_mode: name

gemma-3-27b-it-image:
  <<: *gemma3_27b_defaults
  tier: plain
  multimodal_mode: image

gemma-3-27b-it-name:
  <<: *gemma3_27b_defaults
  tier: plain
  multimodal_mode: name

# ============================================================================
# Multimodal (tier 2) — image vs name with reasoning / thinking
# ============================================================================
#
# Pairs the model's reasoning / thinking mode with either image input
# (-image) or text-only baseline (-name). Tests whether extended
# chain-of-thought helps spatial QA when the model has access to
# visual information vs only the entity's name. Less central than the
# tier-1 or tier-3 multimodal ablations (single-turn reasoning over
# images is a niche case for spatial QA), but included for symmetry
# across tiers.
#
# Native 32 K context is sufficient for tier-2 (single-turn, no agent
# loop), so no YaRN extension needed even on qwen35-27b. The reasoning
# budget (``max_tokens`` for prompted CoT on qwen / gemma, ``thinking``
# budget for native reasoners on gemini) is bounded per-call.

gemini-3-flash-thinking-tier2-image:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: high
  tier: reasoning
  multimodal_mode: image

gemini-3-flash-thinking-tier2-name:
  backend: google
  model_id: gemini-3-flash-preview
  thinking_level: high
  tier: reasoning
  multimodal_mode: name

qwen35-a3b-thinking-tier2-image:
  <<: *qwen35_a3b_defaults
  tier: reasoning
  thinking: true
  batch_size: 64
  multimodal_mode: image

qwen35-a3b-thinking-tier2-name:
  <<: *qwen35_a3b_defaults
  tier: reasoning
  thinking: true
  batch_size: 64
  multimodal_mode: name

qwen35-27b-tier2-image:
  <<: *qwen35_27b_defaults
  tier: reasoning
  batch_size: 32
  multimodal_mode: image
  # Observed 18.75% budget-truncation casualties at the default
  # effective cap of 2048 (qwen 27B prompted-CoT spiraling inside the
  # JSON `reasoning` field on numeric tids 1.1 / 77.1 — model loops
  # "Let's try X. Let's refine. Let's assume Y..." until truncation).
  # The OpenAI backend computes
  #     effective = max(2048, config.max_tokens * 4)
  # for prompted-CoT requests (backends/openai.py:367-372), so
  # setting 1024 here yields 4096 effective — enough headroom to
  # absorb the spirals while keeping cost bounded. Scope is -image
  # only; the text-only -name run hasn't been collected yet and the
  # plain tier2 text-only variant has not shown the same rate.
  max_tokens: 1024

qwen35-27b-tier2-name:
  <<: *qwen35_27b_defaults
  tier: reasoning
  batch_size: 32
  multimodal_mode: name

gemma-3-27b-it-tier2-image:
  <<: *gemma3_27b_defaults
  tier: reasoning
  multimodal_mode: image

gemma-3-27b-it-tier2-name:
  <<: *gemma3_27b_defaults
  tier: reasoning
  multimodal_mode: name

