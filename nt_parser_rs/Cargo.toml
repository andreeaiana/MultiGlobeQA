[package]
name = "nt_parser"
version = "0.1.0"
edition = "2021"
description = "High-performance N-Triples to Delta Lake converter"
authors = ["MultiGlobeQA Team"]

[dependencies]
rio_api = "0.8"
rio_turtle = "0.8"
deltalake = { version = "0.23", features = ["datafusion"] }
arrow = { version = "53" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
glob = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
